# CSRNet Configuration for ShanghaiTech Part A (Dense Crowd Congestion)
dataset:
  name: "ShanghaiTech_Part_A"
  part: "part_A"
  data_root: "./data/ShanghaiTech"
  adaptive_kernel: true
  beta: 0.3
  k_neighbors: 3
  downsample_ratio: 8

model:
  architecture: "CSRNet"
  frontend: "vgg16_dilated"
  backend_dilation: 2
  pretrained_frontend: true

training:
  epochs: 120
  batch_size: 1
  learning_rate: 0.00001
  momentum: 0.95
  weight_decay: 0.0001
  lr_step_size: 30
  lr_gamma: 0.1
  optimizer: "Adam"
  loss_fn: "MSE"

target_metrics:
  target_mae: 68.2
  target_rmse: 115.0
