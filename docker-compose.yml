services:
  # 1. MongoDB with persistent time-series storage
  mongodb:
    image: mongo:7.0
    container_name: crowdsense-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: crowdsense
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    networks:
      - crowdsense-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Python FastAPI AI Service (CSRNet and YOLOv8 inference)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: crowdsense-ai-service
    restart: unless-stopped
    environment:
      - DEFAULT_MODEL=csrnet
      - DEVICE=cpu
      - CSRNET_WEIGHTS_PATH=/app/weights/csrnet_shanghaitech.pth
    volumes:
      - ./ai-service/weights:/app/weights:ro
      - ./ml/weights:/app/ml/weights:ro
    networks:
      - crowdsense-net

  # 3. Node.js + Express API Gateway (Auth, Sockets, Ingestion & Alert Engine)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crowdsense-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/crowdsense?authSource=admin
      - JWT_SECRET=${JWT_SECRET:?Set a unique 32+ character JWT_SECRET in .env}
      - ADMIN_REGISTRATION_CODE=${ADMIN_REGISTRATION_CODE:?Set a unique 24+ character ADMIN_REGISTRATION_CODE in .env}
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=${CORS_ORIGIN:?Set CORS_ORIGIN to the public frontend origin in .env}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - crowdsense-net

  # 4. React Frontend Operations Dashboard (Nginx Production Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crowdsense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - crowdsense-net

networks:
  crowdsense-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
